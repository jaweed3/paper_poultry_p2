# Paper 2 — Pruning-then-PTQ Mitigation (MLCIPR 2026-10-05)
# Single Source of Truth — all scripts read from here. Changing this file changes the experiment reproducibly.
# Do not duplicate values in code; import yaml and read.

project:
  name: "paper_poultry_p2"
  version: "0.1.0-dryrun"
  seed: 42
  fork_from: "jaweed3/paper_poultry_edge@601dbb2"
  paper1_results_symlink: "results/baseline_p1"  # -> ~/paper_poultry_edge/results

dataset:
  source: "Machuve et al. (2022) — Dianyo/poultry-fecal-fl (HF) / Zenodo 4628934"
  hf_id: "Dianyo/poultry-fecal-fl"
  # Local layout after download: data/images/<split>/<class> or data/raw/<class>
  local_roots: ["data/images", "data/raw", "data"]
  classes: ["cocci", "healthy", "ncd", "salmo"]
  alt_names: {coccidiosis: cocci, salmonella: salmo, newcastle: ncd}
  split: {train: 5614, val: 1402, test: 1754, total: 8770}  # HF split; Zenodo raw 6812
  img_size: 224
  normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  # NCD is 8.3% of Zenodo — monitor per-class recall, especially for EM70
  minority_class: "ncd"

models:
  names: ["mobilenetv2", "shufflenetv2", "efficientnet_b0"]
  num_classes: 4
  pretrained: "IMAGENET1K_V1"
  # Param counts (Paper 1): MN2 2.2M, SNV2 1.26M, EB0 4.0M — used for logging, not training logic
  params: {mobilenetv2: 2228996, shufflenetv2: 1257704, efficientnet_b0: 4012672}

training:
  # Exactly as Paper 1 for reproducibility — dry run uses tiny subset, but hparams identical
  optimizer: "Adam"
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: "CosineAnnealingLR"
  scheduler_T_max: 50
  batch_size: 32
  epochs: 50
  num_workers: 4
  amp: false

finetune:  # Paper 2 only — after pruning
  epochs: 15          # 10-20 range; 15 default
  lr: 0.00005         # 5e-5
  scheduler: "cosine" # or "constant"
  batch_size: 32

pruning:
  library: "torch-pruning"   # via DepGraph (Fang et al. CVPR 2023)
  method: "L1-norm"
  scope: "Conv+BN channel (structured)"
  skip: ["classifier", "fc", "head"]  # never prune classifier
  special: "EB0 SE blocks — do not prune SE aggressively at 70% (fallback 50%)"
  sparsities: [0.0, 0.3, 0.5, 0.7]      # 0.0 = baseline Paper 1
  dryrun_sparsity: 0.3                # dry-run uses 30% on MobileNetV2
  dryrun_model: "mobilenetv2"

quantization:
  # Exactly as Paper 1 — dynamic PTQ per-tensor INT8, no calibration
  export: {opset: 17, dynamic_axes: {input: {0: batch}, output: {0: batch}}}
  ptq: {provider: "CPUExecutionProvider", weight_type: "QInt8", per_tensor: true, calibration: null}

benchmark:
  # Exactly as Paper 1 for apple-to-apple
  x86: {device: "Intel i5-12400F", runs: 200, warmup: 10, provider: "CPUExecutionProvider"}
  rpi5:
    device: "Raspberry Pi 5 (BCM2712 Cortex-A76, 8GB LPDDR4X, Debian 13 trixie, kernel 6.18.34+rpt-rpi-2712)"
    onnxruntime: "1.29.0"
    provider: "CPUExecutionProvider"
    threads: [1, 2, 3, 4]
    # Full sweep uses batch 1 only; spot check uses 1,4,8,16 for MN2
    batches_full: [1]
    batches_spot: [1, 4, 8, 16]
    runs: 200
    warmup: 10
    dryrun: {runs: 5, warmup: 2}  # dry-run uses tiny runs for speed
  # Feasible matrix: 3*4*2*4*1=96 RPi5 +24 x86 =120 +16 spot =136
  feasible_note: "Full factorial 384 -> 136 (batch 1 only full sweep)"

profiling:
  level2: {runs: 10, warmup: 5, threads: 1, batch: 1, dryrun: {runs: 3, warmup: 1}}
  metrics: ["total_nodes", "quantize_linear", "dequantize_linear", "q_dq_ratio", "expansion", "overhead_pct"]

paths:
  data: "data"
  models_fp32: "models/fp32"
  models_onnx: "models/onnx"
  models_ptq: "models/ptq"
  pruned_onnx: "onnx_pruned"
  results: "results"
  rpi5_benchmark: "results/rpi5_benchmark"
  profiling: "results/profiling"
  figures: "figures"
  literature: "literature"

paper:
  venue: "MLCIPR 2026-10-05"
  format: "IEEE 4-6pp A4"
  title_working: "Diagnosing INT8 Quantization Collapse in EfficientNet-B0: Per-Channel Recovery and Scheme x Runtime Characterization for Poultry Fecal Disease Detection on Edge CPUs"
  template_source: "paper/main.tex (from Paper 1)"
