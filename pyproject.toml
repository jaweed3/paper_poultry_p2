[project]
name = "paper-poultry-p2"
version = "0.1.0"
description = "Paper 2: Diagnosing INT8 Quantization Collapse in EfficientNet-B0 (per-channel recovery, scheme x runtime) — MLCIPR 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch==2.5.1",
  "torchvision",
  "torchaudio",
  "onnx==1.22.0",
  "onnxruntime==1.29.0",
  "onnxscript",
  "torch-pruning>=1.6",
  "numpy",
  "pillow",
  "tqdm",
  "psutil",
  "pyyaml",
  "matplotlib",
  "scikit-learn",   # confusion matrix + classification report
  "pyarrow",        # baca HF arrow cache langsung (rebuild sterile)
  "datasets",       # fallback materialisasi HF
]

[tool.uv]
managed = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
